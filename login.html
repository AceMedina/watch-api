<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Watch Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <!-- LEFT PANEL (GREEN) -->
        <div class="auth-left">
            <p class="auth-welcome">Welcome!</p>
            <h1 class="auth-brand">Watch Gallery</h1>
            <div class="auth-divider"></div>
            <p class="auth-tagline">Sign in to browse the collection.</p>
        </div>

        <!-- RIGHT PANEL (WHITE FORM) -->
        <div class="auth-right">
            <h2 class="auth-form-title" id="authFormTitle">Sign In</h2>
            <p class="auth-subtitle" id="authSubtitle">Enter your account details below.</p>

            <form id="authForm" class="auth-form">
                <div class="auth-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required minlength="3">
                </div>

                <div class="auth-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required minlength="4">
                </div>

                <p id="authMessage" class="auth-message"></p>

                <button type="submit" id="authSubmitBtn" class="auth-btn">SIGN IN</button>
            </form>

            <div class="auth-switch">
                <span id="switchPrompt">Don't have an account?</span>
                <button type="button" id="switchModeBtn" class="auth-link-btn">Create Account</button>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
